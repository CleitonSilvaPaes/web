<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #rocket{
            position: fixed;
            animation: lancamento 10s linear 0s infinite;
        }
        @keyframes lancamento {
            0%{
                top: 100vb;
            }

            100%{
                top: 10vb;
            }
            
        }
    </style>
</head>
<body>
    <p id="rocket"> 🚀</p>
</body>
</html>
