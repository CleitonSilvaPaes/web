<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #rocket{
            position: fixed;
            animation: lancamento 10s linear 0s infinite;
        }
        #potate{
            height: 100px;
            width: 100px;
            animation: girar 2s cubic-bezier(0.075, 0.82, 0.165, 1) 0s 5;
        }
        @keyframes lancamento {
            0%{
                top: 100vh;
            }

            100%{
                top: -10vh;
            }
        }

        @keyframes girar {
            0%{
                transform: rotate(0deg);
            }

            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <p id="rocket">🚀</p>
    <p id="potate">🥔</p>
</body>
</html>
