<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { 
            border: 1px solid black;
            margin: 0px; 
            padding: 0px;
            box-sizing: content-box;
        }

        .conteiner{
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: 100px 500px 300px;
            grid-gap: 10px;
        }

        #box1{
            /*
            *grid-column-start: 2;
            *grid-column-end: 4;
            */
            grid-column: 2 / 4;
            grid-row-start: 1;
            grid-row-end: 3;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
        <div class="box" id="box6">box6</div>
        <div class="box" id="box7">box7</div>
        <div class="box" id="box8">box8</div>
        <div class="box" id="box9">box9</div>
        <div class="box" id="box10">box10</div>
    </div>
</body>
</html>
