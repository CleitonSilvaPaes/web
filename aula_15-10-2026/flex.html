<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            border: 1px solid black;
        }
        .conteiner{
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            /*align-items: center; */
            /*align-content: center;*/
            align-items: center;
        }
        .box{ width: 100px; display: flex; flex-shrink: 0;}
        #box5,#box4 { order: -1;} /* ordernar com base na seguencia que aparece no codigo */
        /*Exemplo: box4 e box5 box1 box2 box3*/
        #box5 { order: -2; flex-grow: 1; }
        #box4 { order: -1; flex-grow: 1; }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
