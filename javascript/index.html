<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p id="p1">Oi</p>

    <p class="c1">Texto 2x</p>
    <p class="contador"></p>
    <button id="botao">click</button>

    <script>

        let contador = 0;

        document.querySelector("#botao").addEventListener('click', ()=>{
            // localizar o paragravo
            let paragrafoContador = document.querySelector(".contador")
            // incremetar
            contador++
            // salvar o valor no paragravo
            paragrafoContador.innerHTML = contador;

            if (contador == 5){
                contador = 1;
            }
        })

    </script>
</body>
</html>
