<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7 - Chat com Float e Positions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .nav-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
        }

        .nav-voltar:hover {
            text-decoration: underline;
        }

        /* Container principal do chat alinhado à direita ou centralizado */
        .chat-wrapper {
            max-width: 460px;
            margin: 20px auto 0 auto;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            padding: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        /* Área de mensagens */
        .mensagens-container {
            width: 100%;
        }

        /* Labels com o nome do remetente */
        .autor-label {
            font-size: 12px;
            color: #8c8c8c;
            margin-bottom: 4px;
            padding-left: 8px;
        }

        .autor-direita {
            text-align: left;
            padding-left: 8px;
        }

        /* Balão de mensagem base */
        .balao {
            position: relative;
            padding: 12px 14px 22px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            min-height: 60px;
        }

        /* Limpeza de floats dentro do balão */
        .balao::after {
            content: "";
            display: table;
            clear: both;
        }

        /* Mensagens de Pedro (Branca com borda cinza) */
        .balao-pedro {
            background-color: #ffffff;
            border: 1px solid #d4d4d4;
        }

        /* Mensagens de Eu (Fundo verde claro com borda verde suave) */
        .balao-eu {
            background-color: #d6f8d6;
            border: 1px solid #bceab7;
        }

        /* Avatares flutuantes */
        .avatar-esquerda {
            float: left;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .avatar-direita {
            float: right;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin-left: 12px;
            object-fit: cover;
        }

        /* Texto da mensagem */
        .texto-msg {
            font-size: 14px;
            color: #222222;
            line-height: 1.45;
        }

        .texto-direita {
            text-align: right;
            padding-right: 4px;
        }

        /* Timestamp posicionado absolutamente no canto inferior do balão */
        .hora {
            position: absolute;
            bottom: 5px;
            right: 12px;
            font-size: 11px;
            color: #888888;
        }

        /* Área de inserção de nova mensagem (Input / Textarea) */
        .form-mensagem {
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            background-color: #ffffff;
            position: relative;
        }

        .campo-texto {
            width: 100%;
            min-height: 80px;
            border: none;
            outline: none;
            resize: none;
            font-family: monospace;
            font-size: 14px;
            color: #333333;
        }

        .campo-texto::placeholder {
            color: #777777;
        }

        .barra-acoes {
            margin-top: 8px;
            text-align: right;
        }

        .btn-enviar {
            background-color: #ffffff;
            border: 1px solid #999999;
            padding: 5px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-enviar:hover {
            background-color: #f0f0f0;
            border-color: #666666;
        }
    </style>
</head>

<body>
    <a href="index.html" class="nav-voltar">← Voltar à Lista</a>

    <div class="chat-wrapper">
        <div class="mensagens-container">

            <!-- Mensagem 1: Pedro Silva -->
            <div class="autor-label">Pedro Silva</div>
            <div class="balao balao-pedro">
                <img src="img/pedro.png" alt="Pedro Silva" class="avatar-esquerda"
                    onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=pedro'">
                <div class="texto-msg">Olá, tudo bem?</div>
                <span class="hora">00:50</span>
            </div>

            <!-- Mensagem 2: Eu -->
            <div class="autor-label autor-direita">Eu</div>
            <div class="balao balao-eu">
                <img src="img/user.png" alt="Eu" class="avatar-direita"
                    onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=eu'">
                <div class="texto-msg texto-direita">Estou bem sim, e você?</div>
                <span class="hora">00:55</span>
            </div>

            <!-- Mensagem 3: Pedro Silva -->
            <div class="autor-label">Pedro Silva</div>
            <div class="balao balao-pedro">
                <img src="img/pedro.png" alt="Pedro Silva" class="avatar-esquerda"
                    onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=pedro'">
                <div class="texto-msg">
                    Vamos sair hoje? Sabe conversar e Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum
                    ducimus
                </div>
                <span class="hora">01:01</span>
            </div>

            <!-- Mensagem 4: Eu -->
            <div class="autor-label autor-direita">Eu</div>
            <div class="balao balao-eu">
                <img src="img/user.png" alt="Eu" class="avatar-direita"
                    onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=eu'">
                <div class="texto-msg texto-direita">Criatura ......</div>
                <span class="hora">00:55</span>
            </div>

        </div>

        <!-- Área de digitação e envio -->
        <form class="form-mensagem" action="#" method="get" onsubmit="return false;">
            <textarea class="campo-texto" placeholder="Digite sua mensagem"></textarea>
            <div class="barra-acoes">
                <button type="submit" class="btn-enviar">Enviar</button>
            </div>
        </form>
    </div>
</body>

</html>
