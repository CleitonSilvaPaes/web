<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Layout com Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* Barra superior da janela (estilo navegador da ilustração) */
        .barra-janela {
            width: 100%;
            height: 14vh;
            background-color: #262626;
            display: flex;
            align-items: center;
            padding-left: 4vw;
            gap: 1.5vw;
            flex-shrink: 0;
        }

        .circulo {
            width: 42px;
            height: 42px;
            background-color: #00b8a9;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Área principal abaixo da barra superior */
        .container-principal {
            width: 100vw;
            height: 86vh;
            display: flex;
            flex-direction: row;
        }

        /* Coluna esquerda: Navegação */
        .navegacao {
            width: 23vw;
            height: 100%;
            background-color: #f37f26;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 24px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Coluna direita: Cabeçalho, Conteúdo e Rodapé */
        .coluna-direita {
            width: 77vw;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .cabecalho {
            width: 100%;
            height: 18%;
            background-color: #00a3e0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 24px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .conteudo {
            width: 100%;
            height: 65%;
            background-color: #5d4a9c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 24px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .rodape {
            width: 100%;
            height: 17%;
            background-color: #0085b5;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 24px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Botão flutuante para voltar ao índice */
        .btn-voltar {
            position: fixed;
            top: 16px;
            right: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.2s;
            z-index: 100;
        }

        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>
    <a href="index.html" class="btn-voltar">← Voltar à Lista</a>

    <div class="barra-janela">
        <div class="circulo"></div>
        <div class="circulo"></div>
        <div class="circulo"></div>
    </div>

    <div class="container-principal">
        <nav class="navegacao">NAVEGAÇÃO</nav>

        <div class="coluna-direita">
            <header class="cabecalho">CABEÇALHO</header>
            <main class="conteudo">CONTEÚDO</main>
            <footer class="rodape">RODAPÉ</footer>
        </div>
    </div>
</body>

</html>
