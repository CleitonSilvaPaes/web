<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 - Layout Template com Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .grid-container {
            display: grid;
            width: 100%;
            max-width: 660px;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: repeat(4, 115px);
            gap: 14px;
        }

        .item {
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 38px;
            font-size: 26px;
            font-weight: 800;
            color: #000000;
        }

        .amarelo {
            background-color: #fcdb82;
        }

        .rosa {
            background-color: #f04667;
        }

        /* Posicionamento no Grid conforme a ilustração */
        .item-1 {
            grid-column: 1 / 4;
            grid-row: 1 / 2;
        }

        .item-2 {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }

        .item-3 {
            grid-column: 2 / 3;
            grid-row: 2 / 4;
        }

        .item-4 {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }

        .item-5 {
            grid-column: 1 / 2;
            grid-row: 3 / 5;
        }

        .item-6 {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
        }

        .item-7 {
            grid-column: 2 / 4;
            grid-row: 4 / 5;
        }

        /* Botão para voltar ao índice */
        .btn-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1e293b;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
            z-index: 100;
        }

        .btn-voltar:hover {
            background: #334155;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <a href="index.html" class="btn-voltar">← Voltar à Lista</a>

    <div class="grid-container">
        <div class="item amarelo item-1">1</div>
        <div class="item rosa item-2">2</div>
        <div class="item amarelo item-3">3</div>
        <div class="item rosa item-4">4</div>
        <div class="item amarelo item-5">5</div>
        <div class="item rosa item-6">6</div>
        <div class="item amarelo item-7">7</div>
    </div>
</body>

</html>
