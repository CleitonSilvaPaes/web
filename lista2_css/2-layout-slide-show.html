<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Layout Slide Show com Flex e Transition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .galeria {
            display: flex;
            flex-direction: row;
            width: 90vw;
            max-width: 980px;
            height: 460px;
            gap: 16px;
        }

        .painel {
            flex: 1;
            height: 100%;
            border-radius: 36px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: flex 0.65s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.65s ease, box-shadow 0.4s ease;
            display: flex;
            align-items: flex-end;
            padding: 16px;
        }

        /* Sombra interna suave na base para destacar o texto branco */
        .painel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.15) 35%, transparent 60%);
            opacity: 0.6;
            transition: opacity 0.5s ease;
        }

        /* Imagens da natureza similares à referência */
        .painel-1 {
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80');
        }

        .painel-2 {
            background-image: url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?auto=format&fit=crop&w=1200&q=80');
        }

        .painel-3 {
            background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80');
        }

        .painel-4 {
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80');
        }

        .painel-5 {
            background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1200&q=80');
        }

        /* Comportamento de expansão com :hover (e estado inicial no 2º card igual à imagem da lista) */
        .galeria:not(:hover) .painel-2,
        .galeria .painel:hover {
            flex: 7.5;
            border-radius: 34px;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.18);
        }

        .galeria:not(:hover) .painel-2::before,
        .galeria .painel:hover::before {
            opacity: 1;
        }

        /* Rodapé interno de cada card (ícone circular + texto) */
        .info {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            white-space: nowrap;
        }

        .icone-circulo {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .texto-container {
            color: #ffffff;
            opacity: 0;
            transform: translateX(15px);
            transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s;
            pointer-events: none;
        }

        .galeria:not(:hover) .painel-2 .texto-container,
        .galeria .painel:hover .texto-container {
            opacity: 1;
            transform: translateX(0);
        }

        .titulo {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .subtitulo {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Cores dos ícones conforme a figura */
        .cor-1 {
            color: #e11d48;
        }

        .cor-2 {
            color: #ef4444;
        }

        .cor-3 {
            color: #facc15;
        }

        .cor-4 {
            color: #10b981;
        }

        .cor-5 {
            color: #6366f1;
        }

        /* Botão para voltar ao índice */
        .btn-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1e293b;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s, transform 0.2s;
            z-index: 100;
        }

        .btn-voltar:hover {
            background: #334155;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <a href="index.html" class="btn-voltar">← Voltar à Lista</a>

    <div class="galeria">
        <!-- Card 1 -->
        <div class="painel painel-1">
            <div class="info">
                <div class="icone-circulo cor-1">🚶</div>
                <div class="texto-container">
                    <div class="titulo">Alagomont</div>
                    <div class="subtitulo">Trilhas nas montanhas rochosas</div>
                </div>
            </div>
        </div>

        <!-- Card 2 (Expandido inicialmente como na imagem) -->
        <div class="painel painel-2">
            <div class="info">
                <div class="icone-circulo cor-2">❄️</div>
                <div class="texto-container">
                    <div class="titulo">Oretemauw</div>
                    <div class="subtitulo">Omuke trughte a otufta</div>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="painel painel-3">
            <div class="info">
                <div class="icone-circulo cor-3">🌲</div>
                <div class="texto-container">
                    <div class="titulo">Silvanor</div>
                    <div class="subtitulo">Luz solar entre as sequoias</div>
                </div>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="painel painel-4">
            <div class="info">
                <div class="icone-circulo cor-4">💧</div>
                <div class="texto-container">
                    <div class="titulo">Valelago</div>
                    <div class="subtitulo">Águas cristalinas do vale alpino</div>
                </div>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="painel painel-5">
            <div class="info">
                <div class="icone-circulo cor-5">☀️</div>
                <div class="texto-container">
                    <div class="titulo">Deserto Solis</div>
                    <div class="subtitulo">Cânions dourados ao entardecer</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
