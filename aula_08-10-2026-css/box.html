<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{ border: 1px solid black; }

        html{
            background-color: gray;
            padding: 0px;
            margin: 10px;
        }

        body{
            background-color: beige;
            height: 200vh;
        }
        
        p{
            display: inline-block;
            width: 100px;
            height: 100px;
            padding: 10px;
            outline: 2px dotted purple;
            outline-offset: 20px;
            background-image: url("./img/star-trak.png");
            background-attachment: fixed;
            background-size: 50px;
            background-repeat: no-repeat;
            background-position: 50px 50px;
        }

        span{
            line-height: 50px;
        }

        #Iasmin{
            margin: 30px;
            border-top-color: red;
        }

    </style>
</head>
<body>
    <p>Thiago</p>
    <p>Pedro</p>
    <p id="Iasmin">Iasmin</p>
    <span>Ezequiel</span>
    <span> Y</span>
    <span>   P</span>
</body>
</html>
